# Configuração do Radar i9+ — a equipe (ou o Parceiro, pelo Painel → Configurações) edita este arquivo.
# Termos e textos SEM aspas dentro. Depois de mudar, a próxima Coleta já usa.
nome = "Radar i9+"
projeto = "P2 - Agente de IA para Clipping de Comunicação"   # prefixo do assunto de TODO e-mail (Manual de Envio de E-mail da i9+)
intervalo_dias = 7                      # dias entre um Digest e o próximo (o Sandro escolhe)
link_painel = "http://localhost:8501"   # no PC; se publicar na web, troque pelo endereço público

# Selo "fonte conhecida" no Painel (veracidade): nome do veículo OU domínio (com ponto).
fontes_conhecidas = [
  "gov.br", "leg.br", "camara", "senado", "Embrapii", "Lactec", "SENAI", "Tecpar", "weforum.org", "globalbattery.org",
  "Valor Econômico", "Folha", "Estadão", "O GLOBO", "g1", "CNN Brasil", "Agência Brasil", "Poder360", "Exame",
  "Gazeta do Povo", "Bem Paraná", "Canal Solar", "Agência eixos", "MegaWhat", "Canal Energia", "BNamericas",
  "Reuters", "Bloomberg", "Financial Times", "Euronews", "Energy-Storage.News", "ESS News", "pv magazine",
  "Renewables Now", "Recycling Today", "IDTechEx",
]

[alerta]
relevancia_minima = 8                   # "leia hoje": Relevância >= isto vai no e-mail do mesmo dia (além da marca)
max_itens = 10                          # no máximo N notícias "leia hoje" por e-mail

[ia]
provedor = "gemini"                     # "gemini" | "groq"
modelo = "gemini-3.5-flash-lite"
max_por_coleta = 150                    # protege a cota grátis; o que passar fica para a próxima Coleta
pausa_segundos = 4                      # entre chamadas: ~15 por minuto, o ritmo do Gemini grátis (evita "429 Too Many Requests")
minutos_max = 20                        # tempo máximo de IA por Coleta; o que sobrar fica para a próxima (nada se perde)
# O que é notícia relevante para a i9+ (a IA dá a nota por este texto). Validar com o Jefferson/Sandro.
criterios = """A i9+ / InoveMais (Curitiba-PR) dá segunda vida a baterias de lítio (de carros elétricos, bancos de energia
e equipamentos) e as requalifica para armazenamento de energia, em economia circular. Nota ALTA (8-10): cita a
i9+/InoveMais ou seus parceiros (Lactec, SENAI, Embrapii, Tecpar); lei, norma ou projeto de lei sobre baterias,
descarte ou logística reversa no Brasil; financiamento ou investidor para baterias de segunda vida ou armazenamento;
concorrente brasileiro de reuso/reciclagem de baterias; montadora ou fabricante com programa de segunda vida no Brasil.
Nota MÉDIA (5-7): tecnologia nova de baterias, preço do lítio, mercado global de armazenamento, ESG no setor de energia.
Nota BAIXA (0-4): notícia genérica de energia, carro elétrico sem relação com bateria, propaganda, assunto fora do setor."""

[email]
alerta = ["radar.i9.teste@example.com"]   # destino de teste — trocar pelo do Sandro só depois que ele aprovar
digest = ["radar.i9.teste@example.com"]   # idem

# ---------------- Termos ----------------
